name: Release

# Starts the EAS workflow apps/mobile/.eas/workflows/release.yml, which builds the Android APK
# and publishes it as a GitHub Release (coinroot.apk). Runs when a version tag is pushed
# (git tag v1.0.1 && git push origin v1.0.1; the tag must match app.json's version) or from
# Actions → Release → Run workflow. The same EAS workflow can be started from a terminal:
# cd apps/mobile && bunx eas-cli workflow:run .eas/workflows/release.yml
#
# Needs the repository secret EXPO_TOKEN: an access token of the Expo organization `mnemonics`
# (expo.dev → mnemonics → Settings → Access tokens).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # A tag that doesn't match app.json would publish under the wrong version: stop before building.
      - name: Check the tag matches app.json
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./app.json').expo.version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app.json's version ($version). Update app.json or tag $version."
            exit 1
          fi

      - name: Install
        working-directory: .
        run: bun install --frozen-lockfile

      # Uploads this checkout to EAS and waits, so this run shows whether the release worked.
      - name: Run the EAS release workflow
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bunx eas-cli@^27 workflow:run .eas/workflows/release.yml --non-interactive --wait
